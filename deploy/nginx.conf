# =============================================================================
# PEDILA — nginx como proxy inverso (VARIANTE B: VPS sin panel, o con Ferozo
# usado solo para DNS / correo). Copiar a /etc/nginx/sites-available/pedila.conf,
# reemplazar pedila.com.ar por tu dominio y activar:
#   ln -s /etc/nginx/sites-available/pedila.conf /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
# Certificado: certbot --nginx -d pedila.com.ar -d www.pedila.com.ar (ver README).
# Requiere nginx >= 1.18 (Ubuntu 22.04/24.04, Debian 12).
# =============================================================================

# Límites por IP (segunda capa además del rate limit de la app).
limit_req_zone $binary_remote_addr zone=pedila_general:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=pedila_api:10m rate=15r/s;

upstream pedila_app {
    server 127.0.0.1:3000;
    keepalive 16;
}

# HTTP -> HTTPS (dejando pasar la validación de Let's Encrypt)
server {
    listen 80;
    listen [::]:80;
    server_name pedila.com.ar www.pedila.com.ar;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://pedila.com.ar$request_uri;
    }
}

# www -> sin www
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.pedila.com.ar;
    ssl_certificate     /etc/letsencrypt/live/pedila.com.ar/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pedila.com.ar/privkey.pem;
    return 301 https://pedila.com.ar$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name pedila.com.ar;

    ssl_certificate     /etc/letsencrypt/live/pedila.com.ar/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pedila.com.ar/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:pedila_ssl:10m;
    ssl_session_timeout 1d;

    # Imágenes de hasta 5 MB + margen del multipart.
    client_max_body_size 8m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml text/csv;

    # Las imágenes subidas se sirven directo del disco (sin pasar por Node).
    location /uploads/ {
        alias /home/pedila/pedila/shared/uploads/;
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
    }

    # Webhooks de Mercado Pago: sin límite agresivo (MP reintenta).
    location /api/webhooks/ {
        proxy_pass http://pedila_app;
        include /etc/nginx/snippets/pedila-proxy.conf;
    }

    location /api/ {
        limit_req zone=pedila_api burst=40 nodelay;
        proxy_pass http://pedila_app;
        include /etc/nginx/snippets/pedila-proxy.conf;
    }

    location / {
        limit_req zone=pedila_general burst=60 nodelay;
        proxy_pass http://pedila_app;
        include /etc/nginx/snippets/pedila-proxy.conf;
    }
}

