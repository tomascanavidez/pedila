# =============================================================================
# PEDILA — VARIANTE A'' (cuando el panel usa nginx como frontal y permite agregar
# bloques "location" o configuración adicional al sitio).
# Pegar dentro del bloque server { } del dominio que gestiona el panel.
# Si el panel no lo permite, consultá a soporte o usá la variante B.
# =============================================================================
client_max_body_size 8m;

location /uploads/ {
    alias /home/pedila/pedila/shared/uploads/;
    try_files $uri =404;
    expires 30d;
    add_header Cache-Control "public, max-age=2592000, immutable" always;
}

location / {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_read_timeout 60s;
}
