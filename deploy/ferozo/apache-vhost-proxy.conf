# =============================================================================
# PEDILA — VARIANTE A (Apache gestionado por el panel Ferozo)
#
# Directivas para el VirtualHost *:443 del dominio (y el *:80 si el panel no
# redirige solo a HTTPS). El SSL lo sigue manejando el certificado que emite Ferozo.
#
# IMPORTANTE: si podés agregar directivas propias al VirtualHost depende de la
# versión del panel y del plan contratado. Si el panel no ofrece un campo de
# "directivas personalizadas" o "proxy a puerto local", pedile a soporte de DonWeb
# que agregue este bloque (o que habilite mod_proxy). Alternativa siempre válida:
# variante B (deploy/nginx.conf) por SSH. Ver README › Despliegue.
#
# Módulos necesarios: mod_proxy, mod_proxy_http, mod_headers (y mod_rewrite para
# la variante .htaccess). En Debian/Ubuntu: a2enmod proxy proxy_http headers rewrite
# =============================================================================

ProxyPreserveHost On
ProxyRequests Off
RequestHeader set X-Forwarded-Proto "https"
RequestHeader set X-Forwarded-Port "443"

# Las imágenes subidas se sirven directo desde el disco.
ProxyPass /uploads/ !
Alias /uploads/ /home/pedila/pedila/shared/uploads/
<Directory /home/pedila/pedila/shared/uploads/>
    Require all granted
    Options -Indexes
    Header set Cache-Control "public, max-age=2592000, immutable"
    Header set X-Content-Type-Options "nosniff"
</Directory>

# Todo lo demás va a la app Node en 127.0.0.1:3000.
ProxyPass        / http://127.0.0.1:3000/ retry=0 timeout=60 keepalive=On
ProxyPassReverse / http://127.0.0.1:3000/

LimitRequestBody 8388608
